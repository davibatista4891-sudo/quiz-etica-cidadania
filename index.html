function salvarProgressoFase(){
let progresso = JSON.parse(localStorage.getItem('quizProgresso') || '{}');
progresso[`fase${currentPhase+1}`] = {pontos: phaseScore, acertos: hits, erros: errors};
progresso.totalGeral = totalScore;
localStorage.setItem('quizProgresso', JSON.stringify(progresso));
}

function limparProgresso(){
localStorage.removeItem('quizProgresso');
localStorage.removeItem('quizRanking');
totalScore = 0;
currentPhase = 0;
location.reload();
}

function saveScore(){
let nome = prompt("Digite seu nome para salvar no ranking:");
if(!nome) nome = "Anônimo";
let ranking = JSON.parse(localStorage.getItem('quizRanking') || '[]');
ranking.push({nome: nome, pontos: totalScore});
ranking.sort((a,b) => b.pontos - a.pontos);
ranking = ranking.slice(0, 10);
localStorage.setItem('quizRanking', JSON.stringify(ranking));
}

function showRanking(){
let ranking = JSON.parse(localStorage.getItem('quizRanking') || '[]');
let html = '';
if(ranking.length === 0){
html = '<div>Nenhuma pontuação salva ainda!</div>';
}else{
ranking.forEach((item, i) => {
let medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}º`;
html += `<div>${medal} ${item.nome} - ${item.pontos} pts</div>`;
});
}
document.getElementById('rankingList').innerHTML = html;
document.getElementById('rankingModal').style.display = 'flex';
}

let currentPhase = 0;
let currentQuestion = 0;
let phaseScore = 0;
let totalScore = 0;
let hits = 0;
let errors = 0;
let time = 10;
let timer;

const start = document.getElementById("start");
const quiz = document.getElementById("quiz");
const result = document.getElementById("result");

function startGame(){
start.classList.remove("active");
quiz.classList.add("active");
phaseScore = 0;
hits = 0;
errors = 0;
currentQuestion = 0;
showQuestion();
}

function startTimer(){
clearInterval(timer);
time = 10;
document.getElementById("timer").innerHTML = `⏳ ${time}s`;
timer = setInterval(()=>{
time--;
document.getElementById("timer").innerHTML = `⏳ ${time}s`;
if(time <= 0){
clearInterval(timer);
errors++;
feedback("⏰ Tempo esgotado!",false);
}
},1000);
}

function showQuestion(){
const q = phases[currentPhase][currentQuestion];
document.getElementById("phase").innerHTML = `🏆 Fase ${currentPhase+1}`;
document.getElementById("counter").innerHTML = `📚 ${currentQuestion+1}/10`;
document.getElementById("score").innerHTML = `⭐ ${phaseScore}`;
document.getElementById("question").innerHTML = q.question;
document.getElementById("bar").style.width = `${((currentQuestion+1)/10)*100}%`;
const answers = document.getElementById("answers");
answers.innerHTML = "";
q.answers.sort(()=>Math.random()-0.5);
q.answers.forEach(a=>{
const btn = document.createElement("button");
btn.innerHTML = a.text;
btn.onclick = ()=>{
clearInterval(timer);
if(a.correct){
phaseScore += 10;
hits++;
feedback("✅ Você acertou!",true);
}else{
errors++;
feedback("❌ Você errou!",false);
}
};
answers.appendChild(btn);
});
startTimer();
}

function feedback(text,correct){
const msg = document.getElementById("message");
msg.innerHTML = text;
msg.className = correct ? "correct" : "wrong";
msg.style.display = "block";
msg.style.fontSize = "20vw";
setTimeout(()=>{
msg.style.display = "none";
currentQuestion++;
if(currentQuestion < 10){
showQuestion();
}else{
showResults();
}
},1500);
}

function showResults(){
quiz.classList.remove("active");
result.classList.add("active");
totalScore += phaseScore;
salvarProgressoFase();
if(phaseScore === 100){
confetti({particleCount: 200, spread: 100, origin: { y: 0.6 }});
setTimeout(() => confetti({particleCount: 100, spread: 120}), 250);
setTimeout(() => confetti({particleCount: 100, spread: 120}), 500);
}
let porcentagemAcertos = (hits / 10) * 100;
let porcentagemErros = (errors / 10) * 100;
document.getElementById("points").innerHTML = `✅ Acertos: ${porcentagemAcertos.toFixed(0)}%`;
document.getElementById("hits").innerHTML = `❌ Erros: ${porcentagemErros.toFixed(0)}%`;
document.getElementById("errors").innerHTML = `⭐ Pontos da fase: ${phaseScore}/100`;
let msg = "";
if(phaseScore >= 80){ msg = "Excelente desempenho!"; }
else if(phaseScore >= 60){ msg = "Bom resultado!"; }
else { msg = "Estude mais o conteúdo."; }
document.getElementById("msg").innerHTML = msg;
document.getElementById("nextBtn").style.display = currentPhase < 9 ? "block" : "none";
}


function nextPhase(){
currentPhase++;
currentQuestion = 0;
phaseScore = 0;
hits = 0;
errors = 0;
result.classList.remove("active");
quiz.classList.add("active");
showQuestion();
}
